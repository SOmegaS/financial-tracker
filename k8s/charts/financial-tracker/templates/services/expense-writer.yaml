apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-expense-writer
  labels:
    app.kubernetes.io/component: expense-writer
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: expense-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: expense-writer
    spec:
      containers:
        - name: expense-writer
          imagePullPolicy: Always
          image: {{ .Values.services.expenseWriterImage }}
          env:
            - name: MEMORY_LIMIT
              value: "-Xmx950m"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Release.Name }}-kafka:9092
            - name: DB_HOST
              value: {{ .Release.Name }}-postgres-primary
          ports:
            - name: http-app
              containerPort: 8080
            - name: http-metrics
              containerPort: 2115
          resources:
            limits:
              memory: "1024Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-expense-writer
spec:
  selector:
    app.kubernetes.io/component: expense-writer
  ports:
    - name: http-app
      port: 8080
      targetPort: http-app
    - name: http-metrics
      port: 2115
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-expense-writer-sm
  namespace: monitoring
  labels:
    app.kubernetes.io/component: expense-writer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: expense-writer
  namespaceSelector:
    matchNames:
      - default         
  endpoints:
    - port: http-metrics
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
